version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  hello-world-job:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: "Hello World Command"
          command: echo "Hello, World!"

workflows:
  say-hello-workflow:
    jobs:
      - say-hello

  hello-world-workflow:
    jobs:
      - hello-world-job